name: gymquest
description: GymQuest — gamification de la pratique sportive en salle.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  geolocator: ^12.0.0
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  camera: ^0.11.0+2
  video_player: ^2.9.1
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_dotenv: ^5.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
